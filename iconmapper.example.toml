# iconmapper configuration sample.
# Copy this file to "iconmapper.toml" (next to iconmapper.exe, or to
# %USERPROFILE%\.local\share\iconmapper\), then edit.

# How often (ms) to poll for new windows. Default: 2000
poll_interval_ms = 2000

# Badge compositing: draw a second icon at the bottom-right corner of every
# rule's icon (like xpra does for icons received from the remote side).
# Relative paths are resolved against this config file's directory.
#
# overlay_ico = "icons\\badge.ico"  # badge icon (applies to all rules)
# overlay_scale = 0.5               # badge size as a fraction of the icon size (0.1-1.0)
# overlay_margin = 0                # inset from the bottom-right corner, in px

# Rules are evaluated top to bottom; the FIRST match wins.
# Put specific rules before generic ones.
#
#   exe          process name, exact match, case-insensitive (required)
#   title        window title substring, case-insensitive
#   title_regex  window title regex (takes priority over `title` when both set)
#   ico          icon file; absolute path, or relative to the config file's dir
#   overlay_ico  per-rule badge override (see above)
#   overlay      false to skip the badge for this rule (default true)
#
# Windows that match no rule are left untouched.

[[rules]]
exe = "notepad.exe"
title = "todo"
ico = "icons\\green.ico"
# overlay_ico = "icons\\other-badge.ico"  # per-rule badge override
# overlay = false                         # or skip the badge entirely

[[rules]]
exe = "notepad.exe"
title_regex = "report.*\\.md"
ico = "icons\\blue.ico"
